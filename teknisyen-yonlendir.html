<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KARACA — Servis Listesi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',system-ui,sans-serif;background:#0f172a;min-height:100vh;color:white;padding-bottom:80px;}

        .topbar{background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
        .back-btn{background:none;border:none;color:rgba(255,255,255,0.7);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;font-family:'Inter',sans-serif;}
        .back-btn svg{width:18px;height:18px;}
        .page-title{font-size:15px;font-weight:800;}
        .new-btn{background:linear-gradient(135deg,#059669,#10b981);color:white;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}

        /* Search */
        .search-bar{padding:12px 16px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.06);}
        .search-wrap{position:relative;}
        .search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.35);}
        .search-ico svg{width:15px;height:15px;}
        #searchInput{width:100%;padding:9px 11px 9px 34px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:white;font-size:13px;font-family:'Inter',sans-serif;}
        #searchInput::placeholder{color:rgba(255,255,255,0.3);}
        #searchInput:focus{outline:none;border-color:#3b82f6;}

        /* Filters */
        .filter-row{display:flex;gap:7px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;}
        .filter-row::-webkit-scrollbar{display:none;}
        .ftab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.55);cursor:pointer;font-family:'Inter',sans-serif;}
        .ftab.active{background:rgba(37,99,235,0.2);border-color:rgba(37,99,235,0.35);color:#93c5fd;}

        /* Stats row */
        .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 12px;}
        .sbox{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:9px;text-align:center;}
        .sbox-val{font-size:20px;font-weight:800;line-height:1;}
        .sbox-lbl{font-size:9px;color:rgba(255,255,255,0.4);margin-top:3px;font-weight:500;}

        /* List */
        .list{padding:0 16px;}
        .list-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;color:rgba(255,255,255,0.35);}

        .servis-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:13px;margin-bottom:8px;cursor:pointer;transition:all 0.2s;}
        .servis-card:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15);}
        .sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
        .sc-no{font-size:12px;font-weight:800;color:#60a5fa;}
        .sc-date{font-size:10px;color:rgba(255,255,255,0.35);}
        .sc-mid{margin-bottom:8px;}
        .sc-name{font-size:14px;font-weight:700;margin-bottom:2px;}
        .sc-device{font-size:11px;color:rgba(255,255,255,0.55);}
        .sc-ariza{font-size:11px;color:#fca5a5;margin-top:2px;}
        .sc-bot{display:flex;justify-content:space-between;align-items:center;}
        .sc-addr{font-size:10px;color:rgba(255,255,255,0.4);flex:1;}
        .sc-tutar{font-size:12px;font-weight:700;color:#34d399;}
        .durum-pill{font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
        .pill-blue{background:rgba(37,99,235,0.15);border:1px solid rgba(37,99,235,0.25);color:#93c5fd;}
        .pill-green{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;}
        .pill-red{background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.25);color:#fca5a5;}
        .pill-amber{background:rgba(217,119,6,0.15);border:1px solid rgba(217,119,6,0.25);color:#fcd34d;}

        /* Empty */
        .empty{text-align:center;padding:48px 20px;color:rgba(255,255,255,0.25);}
        .empty-ico{font-size:36px;margin-bottom:12px;}

        /* Teknisyen yönlendirme mode */
        .yon-banner{margin:10px 16px;background:rgba(37,99,235,0.12);border:1px solid rgba(37,99,235,0.2);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
        .yon-banner-txt{flex:1;font-size:12px;color:#93c5fd;}
        .yon-banner-txt strong{display:block;font-size:13px;color:white;margin-bottom:2px;}
        .yon-skip{background:none;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;}

        /* Bottom FAB */
        .fab{position:fixed;bottom:20px;right:20px;width:52px;height:52px;background:linear-gradient(135deg,#1e40af,#3b82f6);border:none;border-radius:50%;color:white;font-size:24px;cursor:pointer;box-shadow:0 6px 20px rgba(37,99,235,0.4);display:flex;align-items:center;justify-content:center;transition:all 0.2s;z-index:40;}
        .fab:hover{transform:scale(1.08);}

        /* Drawer */
        .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:100;align-items:flex-end;}
        .drawer-overlay.show{display:flex;}
        .drawer{background:#1e293b;border:1px solid rgba(255,255,255,0.1);border-radius:20px 20px 0 0;width:100%;max-height:92vh;display:flex;flex-direction:column;animation:slideUp 0.25s ease;}
        @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
        .drawer-handle{width:36px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:10px auto 0;}
        .drawer-head{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;}
        .drawer-title{font-size:15px;font-weight:800;}
        .drawer-close-btn{background:none;border:none;color:rgba(255,255,255,0.45);cursor:pointer;}
        .drawer-close-btn svg{width:20px;height:20px;}
        .drawer-body{flex:1;overflow-y:auto;padding:14px 18px;}

        /* Detail sections */
        .det-section{margin-bottom:16px;}
        .det-title{font-size:10px;font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
        .det-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .det-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:8px 10px;}
        .det-item.full{grid-column:1/-1;}
        .det-lbl{font-size:9px;color:rgba(255,255,255,0.4);margin-bottom:2px;font-weight:600;text-transform:uppercase;}
        .det-val{font-size:12px;font-weight:600;}
        .det-val.red{color:#fca5a5;}

        /* Teknisyen listesi */
        .tek-item{padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;cursor:pointer;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;transition:all 0.15s;}
        .tek-item:hover,.tek-item.selected{background:rgba(37,99,235,0.15);border-color:rgba(37,99,235,0.3);}
        .tek-name{font-size:13px;font-weight:600;}
        .tek-check{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;}
        .tek-item.selected .tek-check{background:#22c55e;border-color:#22c55e;}
        .tek-item.selected .tek-check::after{content:'✓';font-size:11px;color:white;font-weight:700;}

        .drawer-footer{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:8px;}
        .dfooter-btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
        .dfooter-blue{background:linear-gradient(135deg,#1e40af,#3b82f6);color:white;}
        .dfooter-green{background:linear-gradient(135deg,#059669,#10b981);color:white;}
        .dfooter-gray{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.1);}

        /* Toast */
        .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:#059669;color:white;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all 0.3s;z-index:300;white-space:nowrap;}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
<div class="topbar">
    <button class="back-btn" onclick="window.location.href='ana-sayfa.html'">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Ana Sayfa
    </button>
    <div class="page-title">Servis Listesi</div>
    <button class="new-btn" onclick="window.location.href='yeni-servis.html'">+ Yeni</button>
</div>

<div class="search-bar">
    <div class="search-wrap">
        <div class="search-ico"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>
        <input type="text" id="searchInput" placeholder="Müşteri, servis no, cihaz ara..." oninput="render()">
    </div>
</div>

<div class="filter-row">
    <button class="ftab active" onclick="setFilter('tumu',this)">Tümü</button>
    <button class="ftab" onclick="setFilter('bekleyen',this)">Bekleyen</button>
    <button class="ftab" onclick="setFilter('aktif',this)">Aktif</button>
    <button class="ftab" onclick="setFilter('tamamlandi',this)">Tamamlandı</button>
    <button class="ftab" onclick="setFilter('iptal',this)">İptal</button>
    <button class="ftab" onclick="setFilter('bugun',this)">Bugün</button>
</div>

<!-- Teknisyen yönlendirme banner (sadece yeni kayıttan gelince gösterilir) -->
<div class="yon-banner" id="yonBanner" style="display:none;">
    <div style="font-size:20px;">📋</div>
    <div class="yon-banner-txt">
        <strong id="yonServisNo">Yeni Servis</strong>
        Teknisyen atamak için servise tıklayın
    </div>
    <button class="yon-skip" onclick="clearYon()">Atla</button>
</div>

<div class="stats-row">
    <div class="sbox"><div class="sbox-val" id="stToplam">0</div><div class="sbox-lbl">Toplam</div></div>
    <div class="sbox"><div class="sbox-val" id="stBekleyen">0</div><div class="sbox-lbl">Bekleyen</div></div>
    <div class="sbox"><div class="sbox-val" id="stAktif">0</div><div class="sbox-lbl">Aktif</div></div>
    <div class="sbox"><div class="sbox-val" id="stBugün">0</div><div class="sbox-lbl">Bugün</div></div>
</div>

<div class="list">
    <div class="list-meta"><span id="listMeta">Yükleniyor...</span><span id="sortBtn" style="cursor:pointer;color:rgba(255,255,255,0.4);" onclick="toggleSort()">↓ Son Kayıt</span></div>
    <div id="listContainer"></div>
</div>

<button class="fab" onclick="window.location.href='yeni-servis.html'" title="Yeni Servis">+</button>

<!-- DETAY + YÖNLENDİRME DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawerBg(event)">
    <div class="drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-head">
            <div class="drawer-title" id="drawerTitle">Servis Detayı</div>
            <button class="drawer-close-btn" onclick="closeDrawer()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
        <div class="drawer-footer" id="drawerFooter"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    if(!sessionStorage.getItem('karaca_auth')) window.location.href='index.html';

    const TEKNISYENLER=[
        {id:'1',ad:'Gezici Bölge Ekibi'},{id:'2',ad:'Bölge Merkez Servisi'},
        {id:'3',ad:'BÖLGE MERKEZ'},{id:'4',ad:'CAN KARACA'},{id:'5',ad:'KÜRŞAT KARAYAKA'}
    ];

    let currentFilter='tumu', sortAsc=false, selectedServis=null, selectedTek=null;
    let yonMode=false; // teknisyen yönlendirme modu

    // Yönlendirme modunu kontrol et (yeni servis'ten gelince)
    const curServisData=sessionStorage.getItem('current_servis');
    if(curServisData){
        const cs=JSON.parse(curServisData);
        if(cs && !cs.teknisyen){
            yonMode=true;
            const banner=document.getElementById('yonBanner');
            banner.style.display='flex';
            document.getElementById('yonServisNo').textContent='#'+cs.servisNo+' — '+cs.musteri.ad;
        }
    }

    function clearYon(){
        yonMode=false;
        document.getElementById('yonBanner').style.display='none';
        sessionStorage.removeItem('current_servis');
    }

    function getServisler(){ return JSON.parse(localStorage.getItem('karaca_servisler')||'[]'); }

    const AKTIF_DURUMLAR=['Teknisyen Yönlendir','Haber Verecek','Parçası Atölyeye Alındı','Farklı Teknisyen Yönlendir','Atölyeye Aldır (Nakliye Gönder)'];
    const TAMAM_DURUMLAR=['Tamamlandı','Yerinde Bakım Yapıldı','Bakım Yapıldı','Ürün Garantili Çıktı'];
    const IPTAL_DURUMLAR=['Fiyatta Anlaşılamadı','Müşteri İptal Etti','Müşteriye Ulaşılamadı'];

    function pillClass(durum){
        if(TAMAM_DURUMLAR.includes(durum)) return 'pill-green';
        if(IPTAL_DURUMLAR.includes(durum)) return 'pill-red';
        if(durum==='Teknisyen Yönlendir') return 'pill-amber';
        return 'pill-blue';
    }

    function setFilter(f,el){
        currentFilter=f;
        document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
        el.classList.add('active');
        render();
    }
    function toggleSort(){ sortAsc=!sortAsc; document.getElementById('sortBtn').textContent=(sortAsc?'↑ En Eski':'↓ Son Kayıt'); render(); }

    function render(){
        const q=document.getElementById('searchInput').value.toLowerCase();
        let servisler=getServisler();
        const bugun=new Date().toDateString();

        // Stats
        document.getElementById('stToplam').textContent=servisler.length;
        document.getElementById('stBekleyen').textContent=servisler.filter(s=>s.durum==='Teknisyen Yönlendir').length;
        document.getElementById('stAktif').textContent=servisler.filter(s=>AKTIF_DURUMLAR.includes(s.durum)).length;
        document.getElementById('stBugün').textContent=servisler.filter(s=>new Date(s.kayitTarihi).toDateString()===bugun).length;

        // Filter
        if(currentFilter==='bekleyen') servisler=servisler.filter(s=>s.durum==='Teknisyen Yönlendir');
        else if(currentFilter==='aktif') servisler=servisler.filter(s=>AKTIF_DURUMLAR.includes(s.durum));
        else if(currentFilter==='tamamlandi') servisler=servisler.filter(s=>TAMAM_DURUMLAR.includes(s.durum));
        else if(currentFilter==='iptal') servisler=servisler.filter(s=>IPTAL_DURUMLAR.includes(s.durum));
        else if(currentFilter==='bugun') servisler=servisler.filter(s=>new Date(s.kayitTarihi).toDateString()===bugun);

        // Search
        if(q) servisler=servisler.filter(s=>{
            const m=s.musteri||{};
            return (m.ad||'').toLowerCase().includes(q)||
                   (m.telefon1||'').includes(q)||
                   String(s.servisNo).includes(q)||
                   (s.cihaz?.marka||'').toLowerCase().includes(q)||
                   (s.cihaz?.tur||'').toLowerCase().includes(q)||
                   (m.ilce||'').toLowerCase().includes(q);
        });

        // Sort
        servisler.sort((a,b)=>sortAsc ? new Date(a.kayitTarihi)-new Date(b.kayitTarihi) : new Date(b.kayitTarihi)-new Date(a.kayitTarihi));

        document.getElementById('listMeta').textContent=servisler.length+' kayıt';
        const cont=document.getElementById('listContainer');
        if(!servisler.length){
            cont.innerHTML='<div class="empty"><div class="empty-ico">📋</div><div style="font-size:13px;">Servis kaydı bulunamadı</div></div>';
            return;
        }
        cont.innerHTML=servisler.map(s=>{
            const pc=pillClass(s.durum);
            const tutar=s.toplamTutar||0;
            return `<div class="servis-card" onclick="openDrawer('${s.id||s.servisNo}')">
                <div class="sc-top">
                    <div>
                        <div class="sc-no">#${s.servisNo}</div>
                        <div class="sc-date">${new Date(s.kayitTarihi).toLocaleDateString('tr-TR')}</div>
                    </div>
                    <div class="durum-pill ${pc}">${s.durum||'-'}</div>
                </div>
                <div class="sc-mid">
                    <div class="sc-name">${s.musteri?.ad||'-'}</div>
                    <div class="sc-device">${s.cihaz?.marka||''} ${s.cihaz?.tur||''} · ${s.cihaz?.model||''}</div>
                    <div class="sc-ariza">${s.cihaz?.ariza||''}</div>
                </div>
                <div class="sc-bot">
                    <div class="sc-addr">📍 ${s.musteri?.ilce||s.musteri?.il||'-'} · 📞 ${s.musteri?.telefon1||'-'}</div>
                    ${tutar>0?`<div class="sc-tutar">${tutar.toLocaleString('tr-TR')} ₺</div>`:''}
                </div>
            </div>`;
        }).join('');
    }

    function findServis(id){
        const list=getServisler();
        return list.find(s=>s.id===id||String(s.servisNo)===String(id));
    }

    function openDrawer(id){
        const s=findServis(id);
        if(!s) return;
        selectedServis=s; selectedTek=s.teknisyen||null;
        document.getElementById('drawerTitle').textContent='Servis #'+s.servisNo;

        const pc=pillClass(s.durum);
        document.getElementById('drawerBody').innerHTML=`
            <div class="det-section">
                <div class="det-title">Durum</div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
                    <span class="durum-pill ${pc}" style="font-size:11px;padding:5px 14px;">${s.durum||'-'}</span>
                    ${s.teknisyen?`<span style="font-size:11px;color:rgba(255,255,255,0.5);">👷 ${s.teknisyen.ad}</span>`:''}
                </div>
            </div>
            <div class="det-section">
                <div class="det-title">Müşteri</div>
                <div class="det-grid">
                    <div class="det-item full"><div class="det-lbl">Ad Soyad</div><div class="det-val">${s.musteri?.ad||'-'}</div></div>
                    <div class="det-item"><div class="det-lbl">Telefon 1</div><div class="det-val">${s.musteri?.telefon1||'-'}</div></div>
                    <div class="det-item"><div class="det-lbl">Müsait Zaman</div><div class="det-val">${new Date(s.musteri?.musaitOlmaZamani?.tarih||Date.now()).toLocaleDateString('tr-TR')} ${s.musteri?.musaitOlmaZamani?.baslangic||''}</div></div>
                    <div class="det-item full"><div class="det-lbl">Adres</div><div class="det-val">${s.musteri?.adres||'-'}, ${s.musteri?.ilce||''}</div></div>
                </div>
            </div>
            <div class="det-section">
                <div class="det-title">Cihaz</div>
                <div class="det-grid">
                    <div class="det-item"><div class="det-lbl">Marka</div><div class="det-val">${s.cihaz?.marka||'-'}</div></div>
                    <div class="det-item"><div class="det-lbl">Tür</div><div class="det-val">${s.cihaz?.tur||'-'}</div></div>
                    <div class="det-item full"><div class="det-lbl">Model</div><div class="det-val">${s.cihaz?.model||'-'}</div></div>
                    <div class="det-item full"><div class="det-lbl">Arıza</div><div class="det-val red">${s.cihaz?.ariza||'-'}</div></div>
                </div>
            </div>
            <div class="det-section">
                <div class="det-title">Teknisyen Ata</div>
                ${TEKNISYENLER.map(t=>`
                    <div class="tek-item ${selectedTek?.id===t.id?'selected':''}" id="tek_${t.id}" onclick="selectTek('${t.id}')">
                        <div class="tek-name">${t.ad}</div>
                        <div class="tek-check"></div>
                    </div>`).join('')}
            </div>
        `;

        document.getElementById('drawerFooter').innerHTML=`
            <button class="dfooter-btn dfooter-gray" onclick="closeDrawer()">Kapat</button>
            <button class="dfooter-btn dfooter-blue" onclick="goToDetail()">Detay Aç</button>
            <button class="dfooter-btn dfooter-green" onclick="yonlendir()">Ata & Kaydet</button>
        `;
        document.getElementById('drawerOverlay').classList.add('show');
    }

    function selectTek(id){
        selectedTek=TEKNISYENLER.find(t=>t.id===id)||null;
        document.querySelectorAll('.tek-item').forEach(el=>el.classList.remove('selected'));
        document.getElementById('tek_'+id)?.classList.add('selected');
    }

    function closeDrawer(){ document.getElementById('drawerOverlay').classList.remove('show'); selectedServis=null; selectedTek=null; }
    function closeDrawerBg(e){ if(e.target===document.getElementById('drawerOverlay')) closeDrawer(); }

    function goToDetail(){
        if(!selectedServis) return;
        sessionStorage.setItem('current_servis',JSON.stringify(selectedServis));
        window.location.href='servis-detay.html';
    }

    function yonlendir(){
        if(!selectedServis){ toast('Servis seçilmedi'); return; }
        const s=selectedServis;
        if(selectedTek){
            s.teknisyen=selectedTek;
            if(!s.islemler) s.islemler=[];
            s.islemler.push({tarih:new Date().toISOString(),islemiYapan:'Çağrı Merkezi',aciklama:'Teknisyen atandı: '+selectedTek.ad});
        }
        s.updatedAt=new Date().toISOString();
        const list=getServisler();
        const idx=list.findIndex(x=>x.id===s.id||x.servisNo===s.servisNo);
        if(idx>=0) list[idx]=s; else list.unshift(s);
        localStorage.setItem('karaca_servisler',JSON.stringify(list));
        sessionStorage.setItem('current_servis',JSON.stringify(s));
        toast(selectedTek?selectedTek.ad+' atandı ✓':'Kaydedildi ✓');
        closeDrawer();
        clearYon();
        render();
    }

    function toast(msg){
        const el=document.getElementById('toast');
        el.textContent=msg; el.classList.add('show');
        setTimeout(()=>el.classList.remove('show'),2500);
    }

    render();
</script>
</body>
</html>
